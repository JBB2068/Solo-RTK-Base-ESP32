name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install platformio "esptool==4.8.1"
      - name: Version
        run: echo "FW_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
      - run: pio test -e native
      - run: pio run -e esp32c3
      - name: Fetch standalone esptool for the Windows package
        run: |
          curl -fsSL -o /tmp/esptool-win.zip https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-win64.zip
          unzip -q /tmp/esptool-win.zip -d /tmp/esptool-win
          echo "ESPTOOL_EXE=$(find /tmp/esptool-win -name esptool.exe | head -n1)" >> "$GITHUB_ENV"
      - run: installer/package.sh "$FW_VERSION"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/site }
      - uses: actions/upload-artifact@v4
        with:
          name: solo-rtk-base-${{ env.FW_VERSION }}
          path: |
            dist/*.zip
            dist/*-factory.bin

  # Web installer at https://<owner>.github.io/<repo>/, always the latest main.
  # (The github-pages environment only accepts the default branch, not tags.)
  # One-time setup: repo Settings > Pages > Source: GitHub Actions.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'solo-rtk-base-*', path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Easiest install:** open the [web installer](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) in Chrome or Edge and click Install.

            Or download a package below:
            - Windows: `...-windows.zip`, unzip, double-click `flash.bat` (or `update-keep-settings.bat`)
            - macOS / Linux: `...-mac-linux.zip`, unzip, run `./flash.sh`
            - `...-factory.bin`: merged image, flash at offset 0x0 with any ESP flasher
