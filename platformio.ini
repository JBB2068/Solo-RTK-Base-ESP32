; Solo RTK base: ESP32-C3 -> MAVLink2 GPS_RTCM_DATA over SoloLink UDP
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall
  '-DFW_VERSION="${sysenv.FW_VERSION}"'
lib_deps =
  https://github.com/mavlink/c_library_v2.git
; keep the c_library_v2 headers out of LDF deep scanning
lib_ldf_mode = chain

; Host-side unit tests for the pure RTCM / fragmenter logic: `pio test -e native`
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
